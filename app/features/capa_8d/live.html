<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>8D Live Review</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --good: #1a7f4b; --good-bg: #e6f4ec; --warning: #a15c00; --warning-bg: #fdf1dc;
    --bad: #b42318; --bad-bg: #fde8e6; --info: #475467; --info-bg: #eef0f3; --accent: #2f5bd3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --panel: #1b1f27; --text: #e6e9ef; --muted: #98a2b3; --border: #2c323d;
      --good: #5ccf8f; --good-bg: #173326; --warning: #f0b24f; --warning-bg: #3a2c14;
      --bad: #f2867c; --bad-bg: #3d1c1a; --info: #b4bccb; --info-bg: #262b35; --accent: #7c9cf5;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 24px 16px; }
  h1 { font-size: 20px; margin: 0 0 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
  label { display: flex; flex-direction: column; gap: 4px; color: var(--muted); font-size: 12px; }
  input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
  button { font: inherit; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 8px 18px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  #log { font: 12px/1.6 ui-monospace, Consolas, monospace; max-height: 70vh; overflow-y: auto; white-space: pre-wrap; margin: 0; }
  #log .error { color: var(--bad); }
  .status { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); margin-bottom: 8px; }
  progress { width: 100%; height: 6px; accent-color: var(--accent); }
  .slide { border-left: 4px solid var(--border); animation: in .3s ease-out; }
  .slide.good { border-left-color: var(--good); } .slide.warning { border-left-color: var(--warning); }
  .slide.bad { border-left-color: var(--bad); } .slide.unrelated { border-left-color: var(--info); }
  @keyframes in { from { opacity: 0; transform: translateY(6px); } }
  .slide header { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 6px; }
  .slide h2 { font-size: 15px; margin: 0; flex: 1; min-width: 200px; }
  .badge { font-size: 11px; font-weight: 600; text-transform: uppercase; border-radius: 4px; padding: 2px 6px; background: var(--info-bg); color: var(--info); }
  .good .verdict, .badge.strength { background: var(--good-bg); color: var(--good); }
  .warning .verdict, .badge.issue, .badge.medium { background: var(--warning-bg); color: var(--warning); }
  .bad .verdict, .badge.error, .badge.high { background: var(--bad-bg); color: var(--bad); }
  ul { margin: 6px 0 0; padding-left: 0; list-style: none; }
  li { margin: 4px 0; } li .badge { margin-right: 6px; }
  .evidence { color: var(--muted); font-style: italic; }
  h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 10px 0 0; }
  #result .score { font-size: 40px; font-weight: 700; }
  .empty { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>8D / CAPA live review</h1>

  <form class="panel" id="form">
    <label>Report (.pptx or .pdf)<input type="file" id="file" accept=".pptx,.pdf" required></label>
    <label>Service key (if SERVICE_KEY is set)<input type="password" id="key" autocomplete="off"></label>
    <button id="start">Review</button>
  </form>

  <div class="layout">
    <div>
      <div class="panel" id="result" hidden></div>
      <div id="slides"><p class="empty">Each slide's review appears here as soon as the AI finishes it.</p></div>
    </div>
    <div class="panel">
      <div class="status"><strong>Processing log</strong><span id="elapsed"></span></div>
      <progress id="progress" value="0" max="1"></progress>
      <pre id="log"></pre>
    </div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let startedAt = 0, timer = 0, slideCount = 0, received = 0;

  const escape = text => String(text ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const seconds = () => ((Date.now() - startedAt) / 1000).toFixed(0) + "s";

  function log(text, error) {
    const line = document.createElement("div");
    line.textContent = `[${seconds().padStart(5)}] ${text}`;
    if (error) line.className = "error";
    $("log").append(line);
    $("log").scrollTop = $("log").scrollHeight;
  }

  function renderSlide(slide) {
    const findings = slide.findings.map(f => `<li><span class="badge ${f.type}">${f.type}</span>${escape(f.text)}`
      + (f.evidence ? ` <span class="evidence">"${escape(f.evidence)}"</span>` : "") + "</li>").join("");
    const suggestions = slide.suggestions.map(s => `<li><span class="badge ${s.priority}">${s.priority}</span>${escape(s.text)}</li>`).join("");
    const card = document.createElement("section");
    card.className = `panel slide ${slide.verdict}`;
    card.innerHTML = `
      <header>
        <h2>${slide.slideNumber}. ${escape(slide.title)}</h2>
        ${slide.discipline ? `<span class="badge">${slide.discipline}</span>` : ""}
        <span class="badge verdict">${slide.verdict}</span>
      </header>
      <div>${escape(slide.assessment)}</div>
      ${findings ? `<h3>Findings</h3><ul>${findings}</ul>` : ""}
      ${suggestions ? `<h3>Suggestions</h3><ul>${suggestions}</ul>` : ""}`;
    $("slides").append(card);
  }

  function renderResult(result) {
    const list = items => items.length ? `<ul>${items.map(i => `<li>${escape(i)}</li>`).join("")}</ul>` : `<p class="empty">None</p>`;
    $("result").innerHTML = `
      <div class="status"><span>Score</span><span>${result.summary.disciplines.map(d => `${d.code}: ${d.status}`).join(" · ")}</span></div>
      <div class="score">${result.score}</div>
      <p><strong>${escape(result.headline)}</strong></p>
      <p>${escape(result.summary.overview)}</p>
      <h3>Strengths</h3>${list(result.summary.strengths)}
      <h3>Gaps</h3>${list(result.summary.gaps)}
      <h3>Next actions</h3>${list(result.summary.nextActions)}`;
    $("result").hidden = false;
  }

  function handle(event, data) {
    if (event === "start") {
      slideCount = data.slideCount;
      $("progress").max = slideCount;
      log(`${slideCount} slides. Sending to the AI, waiting for the first slide...`);
    }
    if (event === "progress") log(`Slide ${data.slideNumber}: ${data.message}...`);
    if (event === "slide") {
      received++;
      $("progress").value = received;
      log(`Slide ${data.slideNumber}/${slideCount} reviewed: ${data.verdict}${data.discipline ? " (" + data.discipline + ")" : ""}`);
      renderSlide(data);
    }
    if (event === "summary") {
      $("progress").value = $("progress").max;
      log(`Done. Score ${data.score}.`);
      renderResult(data);
    }
    if (event === "error") log("Error: " + data.Message, true);
  }

  $("form").addEventListener("submit", async e => {
    e.preventDefault();
    const file = $("file").files[0];
    const form = new FormData();
    form.append("file", file);

    $("start").disabled = true;
    $("slides").innerHTML = "";
    $("result").hidden = true;
    $("log").innerHTML = "";
    $("progress").value = 0;
    received = 0;
    startedAt = Date.now();
    timer = setInterval(() => $("elapsed").textContent = seconds(), 1000);
    log(`Uploading ${file.name} (${(file.size / 1048576).toFixed(1)} MB)...`);

    try {
      const headers = { Accept: "text/event-stream" };
      if ($("key").value) headers["X-Service-Key"] = $("key").value;
      const response = await fetch("/api/kat/8dcapa/analyse", {
        method: "POST", body: form, headers,
      });
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.Message || `HTTP ${response.status}`);
      }

      // Server-Sent Events: blocks separated by a blank line, each with "event:" and "data:" lines
      const reader = response.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value.replace(/\r/g, "");
        let end;
        while ((end = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, end);
          buffer = buffer.slice(end + 2);
          const event = block.match(/^event: (.*)$/m)?.[1];
          const data = block.match(/^data: (.*)$/m)?.[1];
          if (event && data) handle(event, JSON.parse(data));
        }
      }
    } catch (error) {
      log("Error: " + error.message, true);
    } finally {
      clearInterval(timer);
      $("elapsed").textContent = seconds();
      $("start").disabled = false;
    }
  });
</script>
</body>
</html>
